<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 de Septiembre</title>
<!-- Fuentes oscuras de Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FK9MT3CLMB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FK9MT3CLMB');
</script>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #000;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
    position: relative;
}

/* EFECTO DE LÍNEAS DE ESCANEO (SCANLINES / TV VIEJA) */
.scanlines {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.4) 50%
    ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
    );
    background-size: 100% 3px, 6px 100%;
}

/* VIÑETA TERRORÍFICA Y LUZ PARPADEANTE */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle,
        transparent 20%,
        rgba(10, 0, 0, 0.6) 60%,
        rgba(0, 0, 0, 0.98) 100%
    );
    pointer-events: none;
    z-index: 1;
}

/* CONTENEDOR PRINCIPAL */
.evento-misterioso {
    position: relative;
    width: 100%;
    min-height: 100dvh; /* Soporte para pantallas móviles dinámicas */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 10px;
    background: #030303;
    overflow: hidden;
}

/* IMAGEN DE FONDO */
.imagen-evento {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(25%) contrast(150%) grayscale(60%) sepia(30%);
    transform: scale(1.05);
    animation: respiracion-oscura 10s ease-in-out infinite, falla-luz 6s infinite;
}

/* NIEBLA ROJA / OSCURA */
.niebla {
    position: absolute;
    inset: -50%;
    z-index: 2;
    background: radial-gradient(
        ellipse at center,
        rgba(120, 0, 0, 0.12),
        transparent 65%
    );
    filter: blur(40px);
    animation: niebla-movimiento 18s linear infinite alternate;
    pointer-events: none;
}

/* OVERLAY CON CONTENIDO */
.overlay-misterioso {
    position: relative;
    z-index: 5;
    width: 100%;
    max-width: 900px;
    text-align: center;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ADVERTENCIA E ICONOS SVG */
.advertencia {
    font-size: clamp(11px, 2.5vw, 15px);
    letter-spacing: clamp(3px, 1vw, 6px);
    color: #ff2222;
    text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
    animation: parpadeo-terror 3s infinite;
    text-transform: uppercase;
}

.icono-peligro {
    width: clamp(16px, 3vw, 24px);
    height: clamp(16px, 3vw, 24px);
    fill: #ff2222;
    filter: drop-shadow(0 0 6px #ff0000);
}

/* TÍTULO CON EFECTO GLITCH DE TERROR */
.titulo-glitch {
    position: relative;
    font-family: 'Creepster', cursive, sans-serif;
    font-size: clamp(38px, 8vw, 90px);
    letter-spacing: clamp(4px, 1vw, 12px);
    color: #eeeeee;
    text-shadow: 
        2px 2px 0px #aa0000,
        -2px -2px 0px #000,
        0 0 20px rgba(255, 0, 0, 0.5);
    margin: 10px 0;
    line-height: 1.1;
    animation: falla-luz 8s infinite;
}

.subtitulo {
    font-size: clamp(13px, 2.5vw, 18px);
    letter-spacing: clamp(2px, 0.8vw, 5px);
    color: #888;
    margin-bottom: 35px;
    text-transform: uppercase;
    font-style: italic;
}

/* CUENTA REGRESIVA RESPONSIVA */
.cuenta-regresiva {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(6px, 2vw, 18px);
    width: 100%;
    flex-wrap: nowrap; /* Evita roturas feas en pantallas chicas */
}

.tiempo {
    flex: 1;
    max-width: 110px;
    min-width: 60px;
    padding: clamp(10px, 2vw, 18px) clamp(4px, 1vw, 12px);
    background: rgba(8, 0, 0, 0.85);
    border: 1px solid rgba(255, 0, 0, 0.3);
    box-shadow: 
        0 0 15px rgba(255, 0, 0, 0.15),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(6px);
    border-radius: 2px;
    transition: transform 0.3s ease;
}

.tiempo:hover {
    border-color: rgba(255, 0, 0, 0.7);
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
}

.tiempo span {
    display: block;
    font-size: clamp(24px, 5vw, 48px);
    font-weight: bold;
    color: #fff;
    text-shadow: 
        0 0 10px rgba(255, 0, 0, 0.8),
        0 0 20px rgba(255, 255, 255, 0.3);
}

.tiempo small {
    display: block;
    margin-top: 6px;
    font-size: clamp(8px, 1.5vw, 11px);
    letter-spacing: clamp(1px, 0.5vw, 3px);
    color: #ff5555;
}

.separador {
    font-size: clamp(20px, 4vw, 35px);
    color: #ff2222;
    text-shadow: 0 0 10px #ff0000;
    animation: parpadeo-terror 1s infinite;
}

/* MENSAJE FINAL */
.mensaje-final {
    margin-top: 40px;
    font-size: clamp(12px, 2vw, 16px);
    letter-spacing: clamp(3px, 1vw, 6px);
    color: #666;
    text-transform: uppercase;
}

/* ANIMACIONES DE SUSPENSO */

@keyframes parpadeo-terror {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.15; }
    52% { opacity: 0.8; }
    54% { opacity: 0.2; }
}

@keyframes falla-luz {
    0%, 100% { opacity: 1; transform: scale(1); }
    92% { opacity: 1; transform: scale(1); }
    93% { opacity: 0.3; transform: skewX(2deg); }
    94% { opacity: 1; transform: skewX(-2deg); }
    95% { opacity: 0.1; }
    96% { opacity: 0.9; }
}

@keyframes respiracion-oscura {
    0%, 100% { transform: scale(1.03); }
    50% { transform: scale(1.09); }
}

@keyframes niebla-movimiento {
    0% { transform: translate(-3%, -3%) rotate(0deg); }
    100% { transform: translate(3%, 3%) rotate(10deg); }
}

/* AJUSTES MÓVILES EXTREMOS (pantallas menores a 380px) */
@media (max-width: 380px) {
    .cuenta-regresiva {
        gap: 3px;
    }
    .tiempo {
        padding: 8px 2px;
    }
    .separador {
        display: none; /* Se ocultan los dos puntos para ahorrar espacio si es ultra pequeño */
    }
}
</style>
</head>

<body>

<!-- EFECTO LÍNEAS DE TV -->
<div class="scanlines"></div>

<div class="evento-misterioso">
    <div class="niebla"></div>

    <img src="imagen-17.jpeg" alt="17 de septiembre" class="imagen-evento">

    <div class="overlay-misterioso">
        
        <p class="advertencia">
            <!-- Icono SVG 1: Advertencia/Peligro -->
            <svg class="icono-peligro" viewBox="0 0 24 24">
                <path d="M12 2L1 21h22L12 2zm0 3.83L20.13 19H3.87L12 5.83zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
            </svg>
            
            <span>ALGO SE ACERCA</span>

            <!-- Icono SVG 2: Advertencia/Peligro -->
            <svg class="icono-peligro" viewBox="0 0 24 24">
                <path d="M12 2L1 21h22L12 2zm0 3.83L20.13 19H3.87L12 5.83zM11 10v4h2v-4h-2zm0 6v2h2v-2h-2z"/>
            </svg>
        </p>

        <h2 class="titulo-glitch">17 DE SEPTIEMBRE 3:33 a.m.</h2>

        <p class="subtitulo">
            El tiempo se agota...
        </p>

        <div class="cuenta-regresiva">
            <div class="tiempo">
                <span id="dias">00</span>
                <small>DÍAS</small>
            </div>

            <div class="separador">:</div>

            <div class="tiempo">
                <span id="horas">00</span>
                <small>HORAS</small>
            </div>

            <div class="separador">:</div>

            <div class="tiempo">
                <span id="minutos">00</span>
                <small>MINUTOS</small>
            </div>

            <div class="separador">:</div>

            <div class="tiempo">
                <span id="segundos">00</span>
                <small>SEGUNDOS</small>
            </div>
        </div>

        <p class="mensaje-final">
            ¿Estás preparado?
        </p>
    </div>
</div>

<script>
function actualizarCuentaRegresiva() {
    const objetivo = new Date("2026-09-17T03:33:00-06:00");
    const ahora = new Date();
    const diferencia = objetivo - ahora;

    if (diferencia <= 0) {
        document.getElementById("dias").textContent = "00";
        document.getElementById("horas").textContent = "00";
        document.getElementById("minutos").textContent = "00";
        document.getElementById("segundos").textContent = "00";

        document.querySelector(".subtitulo").textContent = "YA ESTÁ AQUÍ";
        document.querySelector(".mensaje-final").textContent = "NO HAY ESCAPE";
        document.querySelector(".mensaje-final").style.color = "#ff0000";
        return;
    }

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
    const segundos = Math.floor((diferencia / 1000) % 60);

    document.getElementById("dias").textContent = String(dias).padStart(2, "0");
    document.getElementById("horas").textContent = String(horas).padStart(2, "0");
    document.getElementById("minutos").textContent = String(minutos).padStart(2, "0");
    document.getElementById("segundos").textContent = String(segundos).padStart(2, "0");
}

actualizarCuentaRegresiva();
setInterval(actualizarCuentaRegresiva, 1000);
</script>

</body>
</html>
